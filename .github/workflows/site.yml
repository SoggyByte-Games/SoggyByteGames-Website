name: Build and deploy site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    # Deploying is opt-in: set the repository variable DEPLOY_TO_PAGES to "true"
    # (Settings → Secrets and variables → Actions → Variables) and set
    # Settings → Pages → Source to "GitHub Actions". Until then this job only builds.
    env:
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_TO_PAGES == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure GitHub Pages
        id: pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v5
      - name: Build (includes the public-output safety check)
        run: npm run build
        env:
          # '' for a custom domain, '/<repo>' for <user>.github.io/<repo>
          BASE_PATH: ${{ env.DEPLOY == 'true' && format('{0}/', steps.pages.outputs.base_path) || '/' }}
      - name: Report missing launch values
        run: npm run check:config
      - name: Upload site
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_TO_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
